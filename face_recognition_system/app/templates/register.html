<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container py-5">
      <h1 class="mb-4">Register Employee</h1>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-warning">
            <ul class="mb-0">
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="employee_id" class="form-label">Employee ID</label>
          <input type="text" class="form-control" id="employee_id" name="employee_id" required>
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
          <label for="allowed_area" class="form-label">Allowed Area</label>
          <input type="text" class="form-control" id="allowed_area" name="allowed_area" required>
        </div>
        <div class="mb-3">
          <label for="photos" class="form-label">Face Images (select multiple)</label>
          <input class="form-control" type="file" id="photos" name="photos" accept="image/png, image/jpeg" multiple required>
          <small class="form-text text-muted">Hold Ctrl and click multiple files, or use Shift for range selection. 3-5 images recommended.</small>
        </div>
        <button type="submit" class="btn btn-success">Register</button>
        <a class="btn btn-secondary" href="{{ url_for('index') }}">Back</a>
      </form>
    </div>
  </body>
</html>
